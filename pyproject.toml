[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsinsurance"
version = "0.0.1"
description = "Modelos de series de tiempo con metodología econométrica robusta para la gestión de inversiones de aseguradoras."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "A. Ochoa Arango" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "arch>=7.0",
]

[project.optional-dependencies]
data = ["pandas-datareader>=0.10", "openpyxl>=3.1"]
viz = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tsinsurance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "PD", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["statsmodels.*", "arch.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=tsinsurance --cov-report=term-missing"
markers = ["slow: simulaciones Monte Carlo largas"]
